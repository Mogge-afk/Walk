<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hundpromenaden</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a1409;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#e5f2d6;}
#gw{width:380px;border-radius:14px;overflow:hidden;user-select:none;box-shadow:0 16px 40px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.08);background:#0f1c0d;}
#sc{position:relative;height:240px;overflow:hidden;background:#11200f;}
#cv{display:block;}
#dogs-wrap{position:absolute;bottom:0;left:50%;transform:translateX(-50%);transform-origin:bottom center;transition:transform .08s ease-out;pointer-events:none;z-index:10;}
#enemy{position:absolute;font-size:40px;top:50px;left:50%;transform:translateX(-50%) scale(0.2);display:none;transition:top .85s cubic-bezier(.18,.89,.32,1.2),transform .85s cubic-bezier(.18,.89,.32,1.2);filter:drop-shadow(0 4px 10px rgba(0,0,0,.7));z-index:5;}
#enemy.near{top:88px;transform:translateX(-50%) scale(1.1);}
#flash{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.95);display:none;white-space:nowrap;pointer-events:none;z-index:25;background:rgba(0,0,0,.72);padding:5px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.25);animation:flashPop .2s ease-out;}
@keyframes flashPop{0%{transform:translate(-50%,-50%) scale(.85);opacity:0;}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
.hud-chip{position:absolute;background:rgba(8,18,8,.8);border:1px solid rgba(255,255,255,.18);color:#d8efbe;font-size:11px;font-weight:600;padding:3px 9px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.5);z-index:15;letter-spacing:.3px;}
#lv-b{top:8px;left:10px;}
#pace-b{top:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#c9f59f;text-transform:uppercase;}
#sc-b{top:8px;right:38px;}
#snd-b{top:8px;right:10px;cursor:pointer;padding:3px 7px;font-size:12px;transition:background .15s,transform .1s;}
#snd-b:hover{background:rgba(255,255,255,.2);}
#snd-b:active{transform:scale(.92);}
#biome-label{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:rgba(14,28,12,.88);border:1px solid #78c040;color:#e2ffd0;font-size:11px;font-weight:600;padding:3px 12px;border-radius:12px;display:none;white-space:nowrap;z-index:15;box-shadow:0 2px 10px rgba(0,0,0,.6);}
#ui{padding:12px 14px 14px;background:#0f1c0d;border-top:1px solid rgba(255,255,255,.08);}
#hp{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:7px;}
.pw{font-size:16px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));transition:opacity .25s,transform .25s;}
#st{font-size:12.5px;line-height:1.4;color:#b8dca2;text-align:center;margin-bottom:10px;min-height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4px;}
#st .stance-hint{color:#ffe680;font-style:italic;font-size:11px;margin-top:2px;}
#btns{display:flex;gap:7px;flex-wrap:wrap;}
.gb{flex:1;min-width:72px;padding:9px 5px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.20);border-radius:8px;color:#dff0d0;font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:background .12s,transform .1s;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.gb:hover{background:rgba(255,255,255,.18);}
.gb:active{transform:scale(.96);}
.gb.at{background:rgba(200,55,35,.28);border-color:rgba(220,75,55,.5);color:#ffded8;}
.gb.at:hover{background:rgba(200,55,35,.44);}
.gb.pt{background:rgba(50,120,50,.28);border-color:rgba(70,170,70,.44);color:#e5ffd5;}
.gb.pt:hover{background:rgba(50,120,50,.44);}
.gb.steer{background:rgba(55,95,45,.4);border-color:rgba(90,165,75,.5);color:#d6f2c4;font-size:11px;}
.gb.steer:hover{background:rgba(70,120,55,.55);}
.gb.primary{background:#3b7e28;border-color:#5bb240;color:#fff;box-shadow:0 4px 14px rgba(59,126,40,.4);}
.gb.primary:hover{background:#479632;}
</style>
</head>
<body>

<script>
  // ============================================================
  // SFX — Web Audio synth (from v5)
  // Declared globally (not inside onload) so inline onclick="SFX.toggle()"
  // in the HTML markup can reach it immediately.
  // ============================================================
  const SFX = {
    ctx: null, enabled: true, lastPatter: 0,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    toggle() {
      this.init();
      this.enabled = !this.enabled;
      const btn = document.getElementById('snd-b');
      if (btn) btn.textContent = this.enabled ? '🔊' : '🔇';
      if (this.enabled) this.tone(523, 0.08, 'triangle', 0.2);
    },
    tone(freq, dur=0.1, type='square', vol=0.15, freqEnd=null) {
      if (!this.enabled) return;
      this.init(); if (!this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (freqEnd !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(10,freqEnd), this.ctx.currentTime+dur);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+dur);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime+dur);
      } catch(e) {}
    },
    patter() {
      if (!this.enabled) return;
      const now = performance.now();
      if (now - this.lastPatter < 160) return;
      this.lastPatter = now;
      this.init(); if (!this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(90+Math.random()*20, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime+0.05);
        gain.gain.setValueAtTime(0.065, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+0.05);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime+0.05);
      } catch(e) {}
    },
    swerve(pitchMod=1) {
      if (!this.enabled) return;
      this.init(); if (!this.ctx) return;
      try {
        const bufferSize = Math.floor(this.ctx.sampleRate*0.18);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(bufferSize*0.32));
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type='lowpass'; filter.frequency.setValueAtTime(520*pitchMod, this.ctx.currentTime); filter.Q.value=2.0;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime+0.18);
        noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
        noise.start();
      } catch(e) {}
    },
    bark() { this.tone(360,0.08,'sawtooth',0.22,160); setTimeout(()=>this.tone(440,0.12,'sawtooth',0.24,180),80); },
    jump() { this.tone(210,0.18,'sine',0.22,780); setTimeout(()=>this.tone(700,0.08,'triangle',0.15,420),120); },
    bite() { this.tone(520,0.05,'square',0.2,140); setTimeout(()=>this.tone(190,0.08,'triangle',0.24,60),30); },
    encounter() { this.tone(440,0.08,'square',0.18); setTimeout(()=>this.tone(880,0.16,'square',0.22),80); setTimeout(()=>this.tone(660,0.22,'sawtooth',0.16),180); },
    victory() { [523.25,659.25,783.99,1046.50].forEach((f,i)=>setTimeout(()=>this.tone(f,0.12,'triangle',0.2),i*65)); },
    hurt() { this.tone(280,0.14,'sawtooth',0.25,80); setTimeout(()=>this.tone(150,0.22,'triangle',0.2,50),100); },
    levelUp() { [440,554,659,880,1108].forEach((f,i)=>setTimeout(()=>this.tone(f,0.14,'square',0.18),i*75)); }
  };

window.onload = function() {

  // ============================================================
  // ELEMENTS
  // ============================================================
  const cv  = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 380, H = 240, HORIZON = 100;
  cv.width = W; cv.height = H;

  const elDogs  = document.getElementById('dogs-wrap');
  const elEnemy = document.getElementById('enemy');
  const elFlash = document.getElementById('flash');
  const elLv    = document.getElementById('lv');
  const elScore = document.getElementById('score');
  const elPace  = document.getElementById('pace');
  const elBiome = document.getElementById('biome-label');
  const elSt    = document.getElementById('st');
  const elBtns  = document.getElementById('btns');
  const elHp    = [0,1,2].map(i => document.getElementById('h'+i));
  const elTL    = document.getElementById('tL');
  const elTR    = document.getElementById('tR');
  const elLegL1 = document.getElementById('legL1');
  const elLegR1 = document.getElementById('legR1');

  // ============================================================
  // GAME DATA
  // ============================================================
  const PACE_NAMES = {1:'Lugn lunk', 2:'Pigg trav', 3:'Full galopp'};

  const CROSSINGS = [
    {name:'Trevägskorsning', icon:'🌲', dirs:[{l:'⬅ Vänster',v:-1},{l:'⬆ Rakt',v:0},{l:'➡ Höger',v:1}]},
    {name:'T-korsning',      icon:'🌲', dirs:[{l:'⬅ Vänster',v:-1},{l:'➡ Höger',v:1}]},
    {name:'Gaffelkorsning',  icon:'🌲', dirs:[{l:'↖ Skogen',v:-1},{l:'↗ Öppet fält',v:1}]},
    {name:'Kurva',           icon:'🌿', dirs:[{l:'⬅ Sväng vänster',v:-1},{l:'➡ Sväng höger',v:1}]},
  ];

  // Enemies with rotating stances + memory (from v5), kept in Swedish
  const ENEMY_CATALOG = [
    { icon:'🦊', name:'räv', lv:1, stances:[
      {desc:'Räven smyger lågt i slyet med spetsade öron.', hint:'Låga smygare skräms av höga rörelser och överraskande skall!', good:['skälla','hoppa'], failMsg:'Räven duckar bakom stubben! Den bryr sig inte om nafset.'},
      {desc:'Räven ställer sig bredbent mitt på stigen och visar gaddarna.', hint:'När räven utmanar måste hundarna visa vem som bestämmer med kraft!', good:['bita','skälla'], failMsg:'Att hoppa hjälpte inte, räven stod kvar och blängde!'},
      {desc:'Räven gör blixtsnabba sidosteg för att finta hundarna.', hint:'För snabba språng krävs ett vältajmat mot-hopp eller bett!', good:['hoppa','bita'], failMsg:'Ett skall hann inte träffa den snabbfotade räven!'}
    ]},
    { icon:'🐦', name:'korp', lv:1, stances:[
      {desc:'Korpen dyker i cirklar rakt mot hundarnas huvuden och kraxar hånfullt.', hint:'Fåglar i luften kan mötas med ett flygande skutt eller ett skarpt skall!', good:['hoppa','skälla'], failMsg:'Korpen flyger alldeles för högt för att nå med ett nafs!'},
      {desc:'Korpen sitter på en låg tallgren och vägrar flytta på sig.', hint:'Skall ekar genom trädkronorna och får fågeln att tappa fattningen!', good:['skälla','hoppa'], failMsg:'Grenen är för högt upp för att bita från marken!'},
      {desc:'Korpen pickar djärvt i marken bara en halvmeter framför nosarna.', hint:'Marknära fåglar överrumplas snabbt med ett kraftfullt bett eller hopp!', good:['bita','hoppa'], failMsg:'Korpen bryr sig inte om skallet när den har mat i sikte!'}
    ]},
    { icon:'🦔', name:'igelkott', lv:2, stances:[
      {desc:'Igelkotten rullar ihop sig till en stenhård boll av vassa taggar.', hint:'Rör inte taggarna! Enda säkra sättet är att elegant hoppa över den!', good:['hoppa'], failMsg:'Aj aj aj! Taggarna stack rakt in i hundens nos!'},
      {desc:'Igelkotten prasslar fram och väser hotfullt med nosen i vädret.', hint:'Ett högt skall får igelkotten att retirera in i buskaget!', good:['skälla','hoppa'], failMsg:'Att bita en taggig krabat slutar alltid i tårar!'}
    ]},
    { icon:'🦌', name:'rådjur', lv:2, stances:[
      {desc:'Rådjuret fryser blickstilla mitt på stigen med stora stirrande ögon.', hint:'Rådjur har känslig hörsel och flyr fort vid kraftigt skall!', good:['skälla','hoppa'], failMsg:'Rådjuret står för långt bort för att nå med tänderna!'},
      {desc:'Rådjuret spänner sina kraftiga bakben och gör sig redo för en spark.', hint:'Hoppa undan klövarna i tid för att inte bli träffad!', good:['hoppa','skälla'], failMsg:'Att springa rakt mot klövarna ledde till en smäll!'}
    ]},
    { icon:'🐺', name:'varg', lv:3, stances:[
      {desc:'Vargen står orubblig med sänkt huvud och morrar djupt i bröstet.', hint:'Flockledaren backar inte för ljud – bara hårt motstånd med bett!', good:['bita'], failMsg:'Ett enkelt skall skrämmer ingen hungrig varg!'},
      {desc:'Vargen försöker snabbt smyga runt på sidan för att flankera er.', hint:'Ett snabbt mot-hopp blockerar vargens väg och tvingar den bakåt!', good:['hoppa','bita'], failMsg:'Vargen gled undan och tog kontroll över stigen!'},
      {desc:'Vargen reser ragg och ställer sig i full motståndsposition.', hint:'Då krävs det att båda hundarna skäller i kör eller biter till!', good:['skälla','bita'], failMsg:'Ett hopp i luften lämnade magen helt oskyddad!'}
    ]},
    { icon:'🐗', name:'vildsvin', lv:3, stances:[
      {desc:'Ett dundrande vildsvin sänker trynet och rusar rakt mot er i full fart!', hint:'Stå inte i vägen för galtens betar! Hoppa åt sidan i sista sekunden!', good:['hoppa'], failMsg:'Att bita mot en dundrande galt gör bara ont!'},
      {desc:'Vildsvinet bökar ilsket och kastar upp jord och rötter över stigen.', hint:'Överraska galten med ett massivt skall innan den hinner ladda!', good:['skälla','hoppa'], failMsg:'Trynet är pansarhårt – tänderna gled bara av borsten!'}
    ]}
  ];

  // Enemy memory: same enemy rotates through its stances, doesn't repeat immediately
  const EnemyMemory = {};
  function getRotatedEnemy(level) {
    const pool = ENEMY_CATALOG.filter(e => e.lv <= level);
    const template = pool[Math.floor(Math.random()*pool.length)];
    if (!EnemyMemory[template.name]) {
      EnemyMemory[template.name] = { encounters:0, lastStanceIndex:-1 };
    }
    const mem = EnemyMemory[template.name];
    mem.encounters++;
    const stanceIdx = (mem.lastStanceIndex+1) % template.stances.length;
    mem.lastStanceIndex = stanceIdx;
    return {
      icon: template.icon, name: template.name, lv: template.lv,
      stance: template.stances[stanceIdx], encounters: mem.encounters
    };
  }

  // ============================================================
  // MODE-7 FOREST PATH RENDERER (kept as-is from v4 — this is the good one)
  // ============================================================
  let targetCurve  = 0;
  let currentCurve = 0;
  let camAngle     = 0;
  let scroll       = 0;
  let walking      = false;
  let returnTimer  = null;

  // Active steering while walking (from v5) — nudges the curve target
  let steerX = 0;       // -1..1, player's lateral steering input
  let targetSteerX = 0;

  const ROWS = H - HORIZON;
  const depthLUT = new Float32Array(ROWS);
  for (let sy = 0; sy < ROWS; sy++) depthLUT[sy] = 200 / (sy + 1);

  function setCurve(v, autoReturn) {
    targetCurve = v;
    if (autoReturn && v !== 0) {
      clearTimeout(returnTimer);
      returnTimer = setTimeout(() => { targetCurve = 0; }, 1700);
    }
  }

  function drawSky() {
    const sg = ctx.createLinearGradient(0,0,0,HORIZON);
    sg.addColorStop(0,'#8fb0d8');
    sg.addColorStop(1,'#bcd9a8');
    ctx.fillStyle = sg;
    ctx.fillRect(0,0,W,HORIZON);

    ctx.fillStyle = '#183a10';
    ctx.fillRect(0, HORIZON-22, W, 26);
    const off = ((camAngle * 80) % 26 + 26) % 26;
    for (let x = -26; x < W+26; x += 26) {
      const xx = x + off;
      const hh = 12 + Math.sin(xx*0.18)*5 + Math.cos(xx*0.4)*4;
      ctx.fillStyle = '#132c0b';
      ctx.fillRect(xx, HORIZON-22-hh, 24, hh+3);
    }
    ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = '#fff8d8';
    ctx.beginPath(); ctx.ellipse(W*0.5, 20, 120, 40, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawGroundPlane() {
    const PATH_HALF = 1.15;

    currentCurve += (targetCurve - currentCurve) * 0.045;
    // Active steering blends into the curve calculation
    steerX += (targetSteerX - steerX) * 0.08;
    camAngle     -= currentCurve * 0.0012;
    if (walking) scroll += 0.065;

    const img  = ctx.createImageData(W, ROWS);
    const data = img.data;

    for (let sy = 0; sy < ROWS; sy++) {
      const z = depthLUT[sy];
      const curveX  = -currentCurve * z * z * 0.010 - steerX * z * 0.55;
      const wz_base = z + scroll;
      const fog = z > 50 ? 1 : z / 50;

      for (let sx = 0; sx < W; sx++) {
        const wx = (sx - W*0.5) * z / 200 + curveX;
        const wz = wz_base;

        const absWx  = wx < 0 ? -wx : wx;
        const onPath = absWx < PATH_HALF;
        const onEdge = absWx >= PATH_HALF - 0.12 && absWx < PATH_HALF + 0.20;

        const speckle = (((wx*7)|0) ^ ((wz*3)|0)) & 3;
        const grassCk = (((wx*1.3)|0) + ((wz*0.45)|0)) % 2 === 0;
        const stoneNoise = (((wx*11.3+wz*6.1)|0) % 97);
        const onStone = onPath && stoneNoise === 3 && z < 40;

        let r,g,b;
        if (onStone) { r=150; g=140; b=125; }
        else if (onEdge) { r=42; g=70; b=26; }
        else if (onPath) {
          const base = 106 + speckle*6;
          r = base; g = (base*0.82)|0; b = (base*0.62)|0;
        } else {
          if (grassCk) { r=40; g=94; b=30; }
          else          { r=34; g=82; b=24; }
        }

        r = (r + (170-r)*fog*0.5)|0;
        g = (g + (190-g)*fog*0.5)|0;
        b = (b + (165-b)*fog*0.5)|0;

        const idx = (sy*W+sx)*4;
        data[idx]=r; data[idx+1]=g; data[idx+2]=b; data[idx+3]=255;
      }
    }
    ctx.putImageData(img, 0, HORIZON);
  }

  const TREES = [];
  for (let i=0;i<16;i++) {
    TREES.push({ z: i/16, side: i%2===0 ? -1 : 1, col: ['#1a4a0a','#224a10','#1e4210','#254d14'][i%4] });
  }

  function drawTrees() {
    const sorted = TREES.slice().sort((a,b)=>a.z-b.z);
    sorted.forEach(tree => {
      const depth    = 200 / Math.max((1-tree.z)*80, 0.5);
      const curveOff = -currentCurve * depth * depth * 0.010 - steerX * depth * 0.55;
      const screenX  = W/2 + tree.side * (depth*1.7 + 16) + curveOff;
      const screenY  = HORIZON + (H-HORIZON) * tree.z;

      if (screenX < -30 || screenX > W+30 || screenY > H+10) return;

      const sc = 0.12 + tree.z * 0.85;
      const bY = Math.min(screenY + 4, H);

      ctx.save(); ctx.globalAlpha = 0.15 * tree.z;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(screenX, bY, 13*sc, 4*sc, 0,0,Math.PI*2); ctx.fill();
      ctx.restore();

      ctx.fillStyle = 'rgb('+((42*sc+15)|0)+','+((30*sc+12)|0)+','+((15*sc+6)|0)+')';
      ctx.fillRect(screenX-2*sc, bY-20*sc, 4*sc, 20*sc);

      ctx.fillStyle = tree.col;
      ctx.beginPath(); ctx.ellipse(screenX, bY-20*sc-13*sc, 14*sc, 17*sc, 0,0,Math.PI*2); ctx.fill();

      if (walking) {
        tree.z += 0.0055;
        if (tree.z > 1.05) { tree.z = 0.01; tree.side = Math.random() > 0.5 ? 1 : -1; }
      }
    });
  }

  let leaves = [];
  function initLeaves() {
    leaves = Array.from({length:10}, () => ({
      x: Math.random()*W, y: HORIZON + Math.random()*(H-HORIZON),
      vy: .15+Math.random()*.3, vx: -.1+Math.random()*.2,
      sz: 2.5+Math.random()*3.5,
      c: ['#6b4a1e','#8a6030','#7a5528'][Math.floor(Math.random()*3)],
      r: Math.random()*360
    }));
  }
  function drawLeaves() {
    leaves.forEach(l => {
      ctx.save(); ctx.translate(l.x,l.y); ctx.rotate(l.r*Math.PI/180);
      ctx.fillStyle = l.c;
      ctx.beginPath(); ctx.ellipse(0,0,l.sz,l.sz*0.45,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      l.y += l.vy; l.x += l.vx; l.r += 0.2;
      if (l.y > H+5) { l.y = HORIZON-5; l.x = Math.random()*W; }
    });
  }

  function renderFrame() {
    drawSky();
    drawGroundPlane();
    drawTrees();
    drawLeaves();
  }

  // ============================================================
  // MAIN LOOP
  // ============================================================
  let raf = null, tailT = 0, dogBob = 0, patterTick = 0;

  function loop() {
    tailT += 0.20;
    renderFrame();

    const bobY = walking ? Math.sin(dogBob) * 3.2 : 0;
    if (walking) {
      dogBob += 0.15;
      patterTick++;
      if (patterTick % 9 === 0) SFX.patter();
    }
    const sc = 1 + (G.level - 1) * 0.10;
    const lean = steerX * 10;
    const xOff = steerX * 22;
    elDogs.style.transform = `translateX(calc(-50% + ${xOff}px)) translateY(${bobY}px) scale(${Math.min(sc,1.5)}) rotate(${lean}deg)`;

    elTL.setAttribute('d', `M21 73 Q${8+Math.sin(tailT)*5} ${62+Math.cos(tailT)*3} 12 51`);
    elTR.setAttribute('d', `M129 73 Q${142+Math.sin(tailT)*5} ${62+Math.cos(tailT)*3} 138 51`);

    if (walking) {
      const trot = Math.sin(tailT*1.3);
      if (elLegL1) elLegL1.setAttribute('y', 87 + trot*2);
      if (elLegR1) elLegR1.setAttribute('y', 87 - trot*2);
    }

    raf = requestAnimationFrame(loop);
  }

  // ============================================================
  // GAME LOGIC
  // ============================================================
  const G = {
    hp:3, score:0, level:1, wins:0, phase:'idle', enemy:null,

    rnd(a) { return a[Math.floor(Math.random()*a.length)]; },
    setSt(html) { elSt.innerHTML = html; },
    updHP() { elHp.forEach((el,i) => { el.style.opacity = i<this.hp?'1':'0.25'; el.style.transform = i<this.hp?'scale(1)':'scale(0.8)'; }); },

    flash(msg, good) {
      elFlash.style.animation = 'none'; void elFlash.offsetWidth; elFlash.style.animation = 'flashPop .2s ease-out';
      elFlash.textContent = msg;
      elFlash.style.color = good ? '#90ff90' : '#ff9090';
      elFlash.style.display = 'block';
      clearTimeout(this._ft);
      this._ft = setTimeout(() => elFlash.style.display = 'none', 1400);
    },

    showBtns(arr) {
      elBtns.innerHTML = '';
      arr.forEach(b => {
        const d = document.createElement('div');
        d.className = 'gb ' + (b.cls||'');
        d.textContent = b.label;
        d.onclick = () => { SFX.init(); b.fn(); };
        elBtns.appendChild(d);
      });
    },

    start() {
      SFX.init(); SFX.victory();
      this.hp=3; this.score=0; this.level=1; this.wins=0;
      elLv.textContent = 1; elScore.textContent = 0;
      elPace.textContent = PACE_NAMES[1];
      this.updHP(); initLeaves();
      walking = false; currentCurve = 0; targetCurve = 0; camAngle = 0;
      steerX = 0; targetSteerX = 0;
      if (!raf) loop();
      this.crossPhase();
    },

    steer(dir) {
      targetSteerX = Math.max(-0.85, Math.min(0.85, targetSteerX + dir*0.4));
      SFX.swerve(dir < 0 ? 0.9 : 1.15);
    },

    crossPhase() {
      this.phase = 'walking';
      walking = false;
      targetSteerX = 0;
      const cross = this.rnd(CROSSINGS);
      elBiome.textContent = cross.icon + ' ' + cross.name;
      elBiome.style.display = 'block';
      this.setSt(`En <strong>${cross.name}</strong> dyker upp framför er!`);
      this.showBtns(cross.dirs.map(d => ({
        label: d.l, cls: 'pt',
        fn: () => {
          elBiome.style.display = 'none';
          this.setSt('Hundarna travar iväg längs stigen...');
          walking = true;
          setCurve(d.v, true);
          SFX.swerve(d.v > 0 ? 1.2 : d.v < 0 ? 0.85 : 1);
          // Give the player active steering controls while walking
          this.showBtns([
            {label:'◀ Sväng', cls:'steer', fn:()=>this.steer(-1)},
            {label:'🐾 Håll spåret', cls:'', fn:()=>{ targetSteerX=0; SFX.patter(); }},
            {label:'Sväng ▶', cls:'steer', fn:()=>this.steer(1)},
          ]);
          setTimeout(() => {
            walking = false;
            this.spawnEnemy();
          }, 1900);
        }
      })));
    },

    spawnEnemy() {
      const enemyData = getRotatedEnemy(this.level);
      this.enemy = enemyData;
      elEnemy.textContent = enemyData.icon;
      elEnemy.style.display = 'block';
      elEnemy.classList.remove('near');
      setTimeout(() => elEnemy.classList.add('near'), 80);
      SFX.encounter();

      let memNote = '';
      if (enemyData.encounters > 1) {
        memNote = `<span class="stance-hint">Hundarna känner igen denna ${enemyData.name} sedan tidigare!</span>`;
      }

      setTimeout(() => {
        this.setSt(`En <strong>${enemyData.name}</strong> spärrar stigen!<br>${enemyData.stance.desc}${memNote}`);
        this.fightPhase();
      }, 900);
    },

    fightPhase() {
      this.phase = 'fighting';
      this.showBtns([
        {label:'🗣 Skälla',cls:'at', fn:()=>this.attack('skälla')},
        {label:'🦘 Hoppa', cls:'at', fn:()=>this.attack('hoppa')},
        {label:'🦷 Bita',  cls:'at', fn:()=>this.attack('bita')},
      ]);
    },

    attack(type) {
      if (this.phase !== 'fighting') return;
      this.phase = 'resolving';

      if (type==='skälla') SFX.bark();
      else if (type==='hoppa') SFX.jump();
      else if (type==='bita') SFX.bite();

      const en = this.enemy;
      const win = en.stance.good.includes(type);
      elEnemy.classList.remove('near');
      setTimeout(() => elEnemy.style.display = 'none', 700);

      if (win) {
        this.wins++;
        const pts = this.level * 10;
        this.score += pts;
        elScore.textContent = this.score;

        if (this.wins % 2 === 0) {
          this.level++;
          elLv.textContent = this.level;
          elPace.textContent = PACE_NAMES[Math.min(3,this.level)];
          SFX.levelUp();
          this.flash('Nivå upp! ⭐', true);
          this.setSt(`<strong>Perfekt!</strong> ${en.stance.hint}<br><span class="stance-hint">Nivå ${this.level}! Hundarna ökar farten.</span>`);
        } else {
          SFX.victory();
          this.flash(`Rätt! +${pts}p 🎉`, true);
          this.setSt(`<strong>Bra jobbat!</strong> ${en.stance.hint}`);
        }
      } else {
        this.hp = Math.max(0, this.hp-1);
        this.updHP();
        SFX.hurt();
        this.flash('Fel drag! 💥', false);
        this.setSt(`${en.stance.failMsg}<br><span class="stance-hint">Ledtråd: ${en.stance.hint}</span>`);
      }

      if (this.hp <= 0) setTimeout(() => this.gameOver(), 1500);
      else              setTimeout(() => this.crossPhase(), 1700);
    },

    gameOver() {
      this.phase = 'idle';
      this.setSt(`Promenaden tog slut! Nivå ${this.level} — ${this.score}p`);
      this.flash('Spel över 🐾', false);
      elBiome.style.display = 'none';
      this.showBtns([{label:'🐕 Ny promenad', cls:'primary', fn:()=>this.start()}]);
    }
  };
  window.G = G; // expose globally so onclick="G.start()" in the HTML markup can reach it

  // ---- Keyboard steering (from v5) ----
  window.addEventListener('keydown', (e) => {
    if (!walking) return;
    if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') G.steer(-1);
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') G.steer(1);
  });

  // ---- Boot ----
  initLeaves();
  renderFrame();

}; // end window.onload
</script>
</body>
</html>
